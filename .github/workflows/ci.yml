# Build and test on every push and pull request; the *IT tests start Kafka with Testcontainers.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build, unit and integration tests
        run: ./mvnw -B -ntp verify
      - name: License headers
        run: |
          missing=$(git ls-files '*.java' '*.yml' '*.yaml' '*.xml' '*.sql' '*.properties' '*.html' '*.css' '*.fxml' 'Dockerfile' '*.sh' | grep -v -E '^\.mvn/' | xargs -r grep -L 'SPDX-License-Identifier' || true)
          if [ -n "$missing" ]; then
            echo "These files have no license header:"
            echo "$missing"
            exit 1
          fi

  compose:
    name: Docker Compose end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start Kafka, producer and consumer
        run: docker compose up -d --build --wait kafka producer consumer
      - name: A posted message reaches the consumer
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8787/actuator/health > /dev/null && break; sleep 2; done
          curl -sf -X POST -H 'Content-Type: text/plain' --data 'hello from CI' localhost:8787/message
          for i in $(seq 1 30); do
            curl -sf localhost:8788/messages | grep -q 'hello from CI' && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
